[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mgmanet-public"
version = "0.1.0a0"
description = "Public pre-release evaluation and visualization utilities; research model withheld"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
mgmanet-public = "mgmanet.cli:main"

[tool.setuptools]
packages = ["mgmanet", "mgmanet.models"]
include-package-data = false
